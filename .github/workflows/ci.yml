name: CI

on:
  # Long-lived branches, plus the prefixes real work is done under. Without
  # these, a feature branch gets no CI until it opens a PR, so a broken build
  # is only discovered at the end.
  push:
    branches:
      - master
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'wks/**'
  # No branch filter: a PR targeting any branch is worth checking, and this is
  # the backstop for work on a branch name the push list does not cover.
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./cmd/rivet

      - name: Test
        run: go test ./... -count=1

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # Rivet's own context docs are held to the standard rivet asks of every
      # project. --strict fails on warnings too, so a broken [[link]] or a doc
      # drifting past its review date breaks the build rather than rotting
      # quietly. Runs on one OS only — it reads files, nothing platform-specific.
      - name: Context lint
        if: matrix.os == 'ubuntu-latest'
        run: go run ./cmd/rivet context lint --strict
